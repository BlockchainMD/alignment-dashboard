name: Hourly collection and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Away from the top of the hour to reduce GitHub's peak scheduling load.
    - cron: "17 * * * *"

permissions: {}

# Serialize collection, repository writes, and deployment as one operation.
concurrency:
  group: alignment-dashboard-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node for browser logic tests
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test the collector and browser logic
        shell: bash
        run: |
          python -m unittest discover -s tests
          shopt -s nullglob
          browser_tests=(tests/*.test.mjs)
          if ((${#browser_tests[@]})); then
            node --test "${browser_tests[@]}"
          fi

      - name: Collect new publications from the fixed cutoff
        id: collect
        # A total source outage still writes health and retained records. Deploy
        # that honest state, then mark this workflow failed after publication.
        continue-on-error: true
        run: python scripts/collect.py --output site/data/edition.json --backfill-pages 0

      - name: Validate the generated edition
        run: python -m json.tool site/data/edition.json > /dev/null

      - name: Retain the edition for the next refresh
        shell: bash
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "::error::The default branch changed during collection. A newer push run will refresh and publish it."
            exit 1
          fi
          git add -- data site/data
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh alignment dashboard edition"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Report important coverage outages after publishing
        if: always() && steps.deployment.outcome == 'success'
        run: python scripts/check_health.py --edition site/data/edition.json

      - name: Report collection failure after publishing
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo "::error::The collector failed. The dashboard may show retained records; review its source health and the collector logs."
          exit 1
